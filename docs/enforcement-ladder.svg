<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="80" y="110" font-size="44" font-weight="700" fill="#141413">A promise is only as strong as</text>
  <text x="80" y="165" font-size="44" font-weight="700" fill="#141413">the rung that enforces it.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a85"/>
    </marker>
  </defs>
  <path d="M100 790 V250" stroke="#8a8a85" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="232" font-size="20" fill="#6b6b66">stronger</text>
  <g font-size="26">
    <rect x="150" y="250" width="460" height="74" rx="12" fill="#e8f0fd" stroke="#2f6fde" stroke-width="3"/>
    <text x="178" y="296" font-weight="700" fill="#141413">6 · Cryptography or hardware</text>
    <text x="640" font-size="23" y="296" fill="#4a4a46">No one can break it; clients can verify it</text>

    <rect x="150" y="340" width="460" height="74" rx="12" fill="#e8f0fd" stroke="#2f6fde" stroke-width="3"/>
    <text x="178" y="386" font-weight="700" fill="#141413">5 · Architecture</text>
    <text x="640" font-size="23" y="386" fill="#4a4a46">The system is built so it can't happen</text>

    <rect x="150" y="430" width="460" height="74" rx="12" fill="none" stroke="#b9b8b2" stroke-width="2"/>
    <text x="178" y="476" font-weight="700" fill="#141413">4 · Monitoring</text>
    <text x="640" font-size="23" y="476" fill="#4a4a46">You find out fast when it breaks</text>

    <rect x="150" y="520" width="460" height="74" rx="12" fill="none" stroke="#b9b8b2" stroke-width="2"/>
    <text x="178" y="566" font-weight="700" fill="#141413">3 · Test</text>
    <text x="640" font-size="23" y="566" fill="#4a4a46">A check fails before the break ships</text>

    <rect x="150" y="610" width="460" height="74" rx="12" fill="none" stroke="#b9b8b2" stroke-width="2"/>
    <text x="178" y="656" font-weight="700" fill="#141413">2 · Process</text>
    <text x="640" font-size="23" y="656" fill="#4a4a46">A review or approval is meant to catch it</text>

    <rect x="150" y="700" width="460" height="74" rx="12" fill="#fbebeb" stroke="#c0453a" stroke-width="3"/>
    <text x="178" y="746" font-weight="700" fill="#141413">1 · Policy</text>
    <text x="640" font-size="23" y="746" fill="#4a4a46">A sentence in a doc; nothing enforces it</text>
  </g>
  <text x="150" y="835" font-size="22" fill="#6b6b66">Most "privacy-first" and "safe AI" claims live on rung 1.</text>
  <text x="1120" y="870" font-size="20" fill="#8a8a85" text-anchor="end">promise-check</text>
</svg>
